[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-triage"
version = "0.2.0"
description = "Fetch a Jira ticket, bundle context for Cursor."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "python-dotenv",
  "uvicorn[standard]",
]

[project.scripts]
jira-cursor = "jira_triage.cli:main"
jira-cursor-webhook = "jira_triage.webhook:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jira_triage*"]

